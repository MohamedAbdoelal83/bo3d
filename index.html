<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر بُعد | عالم الـ 3D</title>
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js لخلفية الـ 3D التفاعلية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(19, 27, 46, 0.7);
            --border-color: rgba(139, 92, 246, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية Three.js */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* الهيدر وشريط التنقل */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: 0.3s;
        }

        .cart-btn:hover {
            transform: scale(1.05);
        }

        /* قسم الهيرو (الواجهة) */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            margin-top: 60px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--accent-cyan);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
        }

        /* حاوية المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 5%;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            border-right: 4px solid var(--accent-cyan);
            padding-right: 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.15);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #1e293b;
        }

        .product-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent-cyan);
        }

        .buy-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .buy-btn:hover {
            background: #7c3aed;
        }

        /* السلة الجانبية */
        .cart-drawer {
            position: fixed;
            top: 0;
            left: -400px;
            width: 380px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 2000;
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        .cart-drawer.open {
            left: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: auto;
        }

        .checkout-form input {
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: white;
        }

        .checkout-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <!-- خلفية Three.js -->
    <div id="canvas-container"></div>

    <!-- الهيدر -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-cube"></i> بُعد | Ba'ad
        </div>
        <ul class="nav-links">
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#products">المنتجات</a></li>
        </ul>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i> السلة (<span id="cart-count">0</span>)
        </button>
    </header>

    <!-- الهيرو -->
    <section class="hero">
        <h1>متجر <span>بُعد</span> لأصول النماذج ثلاثية الأبعاد</h1>
        <p>اكتشف أفضل النماذج والملفات المصممة بدقة عالية لمشاريعك وإبداعاتك القادمة.</p>
        <a href="#products" class="buy-btn" style="padding: 0.8rem 2rem; font-size: 1.1rem; text-decoration: none;">تصفح المنتجات</a>
    </section>

    <!-- المنتجات -->
    <div class="container" id="products">
        <h2 class="section-title">أحدث المنتجات</h2>
        <div class="products-grid" id="products-grid">
            <!-- يتم جلب المنتجات ديناميكياً من Supabase -->
            <p style="color: var(--text-muted);">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- السلة الجانبية -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items" style="flex-grow: 1; overflow-y: auto; margin-bottom: 1rem;">
            <p style="color: var(--text-muted);">السلة فارغة حالياً.</p>
        </div>
        <div class="checkout-form">
            <input type="text" id="customerName" placeholder="اسمك الكامل" required>
            <input type="text" id="customerPhone" placeholder="رقم الهاتف للتواصل" required>
            <button class="checkout-btn" onclick="checkout()">إتمام الطلب الآن</button>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة لمتجر بُعد &copy; 2026</p>
    </footer>

    <script>
        // إعدادات الاتصال بـ Supabase (تم ربطها بنجاح)
        const SUPABASE_URL = 'https://lrtliudkfracubpkbuhm.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_-HEpvKoPL40CxNyDDQCE8A_tvVmIpTR';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = [];

        // جلب المنتجات من Supabase وعرضها
        async function fetchProducts() {
            const grid = document.getElementById('products-grid');
            const { data, error } = await _supabase.from('products').select('*');
            
            if (error) {
                grid.innerHTML = '<p style="color: red;">خطأ في تحميل المنتجات تأكد من الاتصال.</p>';
                console.error(error);
                return;
            }

            if (data.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">لا توجد منتجات مضافة حالياً في لوحة تحكم Supabase.</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image || 'https://via.placeholder.com/300'}" class="product-img" alt="${product.name}">
                        <div class="product-content">
                            <div>
                                <h3 class="product-title">${product.name}</h3>
                                <p class="product-desc">${product.description || 'بدون وصف'}</p>
                            </div>
                            <div class="product-footer">
                                <span class="product-price">${product.price} ج.م</span>
                                <button class="buy-btn" onclick="addToCart('${product.name}', ${product.price})">أضف للسلة</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cart-count').innerText = cart.length;
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">السلة فارغة حالياً.</p>';
                return;
            }
            container.innerHTML = '';
            cart.forEach((item, index) => {
                container.innerHTML += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                        <span>${item.name}</span>
                        <span><b>${item.price} ج.م</b></span>
                    </div>
                `;
            });
        }

        // إرسال الطلب لجدول orders في Supabase
        async function checkout() {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;

            if (!name || !phone) {
                alert('الرجاء إدخال الاسم ورقم الهاتف!');
                return;
            }

            if (cart.length === 0) {
                alert('سلة المشتريات فارغة!');
                return;
            }

            const productNames = cart.map(item => item.name).join(' + ');

            const { error } = await _supabase.from('orders').insert([
                { customer_name: name, customer_phone: phone, product_name: productNames }
            ]);

            if (error) {
                alert('حدث خطأ أثناء إتمام الطلب، حاول مرة أخرى.');
                console.error(error);
            } else {
                alert('تم إتمام طلبك بنجاح! سنتواصل معك قريباً.');
                cart = [];
                document.getElementById('cart-count').innerText = 0;
                document.getElementById('customerName').value = '';
                document.getElementById('customerPhone').value = '';
                updateCartUI();
                toggleCart();
            }
        }

        // تشغيل كود جلب المنتجات عند فتح الصفحة
        fetchProducts();

        // خلفية Three.js المكعبات المتحركة
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
